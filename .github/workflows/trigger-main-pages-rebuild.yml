name: Trigger main Pages rebuild

on:
  push:
    branches:
      - w23
      - w24
      - w25
      - w26

permissions:
  contents: write   # needed to call the dispatch API with GITHUB_TOKEN

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch rebuild event to main workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.ref;
            const sha = context.sha;

            core.info(`Dispatching rebuild-pages for ${owner}/${repo} from ${ref} @ ${sha}`);

            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: "rebuild-pages",
              client_payload: { ref, sha }
            });

            core.info("Dispatch sent.");